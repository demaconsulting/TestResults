<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="875" height="551" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="875" height="551" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
  <rect x="190" y="140" width="625" height="351" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="206" y="166" font-size="14" font-weight="600" fill="#2563eb">DemaConsulting.TestResults</text>

  <rect x="480" y="20" width="290" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="625" y="52" font-size="18" font-weight="600" fill="#92400e" text-anchor="middle">Your application</text>
  <text x="625" y="76" font-size="13" fill="#92400e" text-anchor="middle">test runner, report generator, CLI tool</text>

  <line x1="560" y1="104" x2="560" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="550" y="172" font-size="12" fill="#334155" text-anchor="end">create &amp;</text>
  <text x="550" y="188" font-size="12" fill="#334155" text-anchor="end">populate results</text>
  <line x1="690" y1="212" x2="690" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="172" font-size="12" fill="#334155">read &amp; inspect</text>
  <text x="700" y="188" font-size="12" fill="#334155">outcomes, report</text>

  <rect x="480" y="216" width="290" height="250" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="246" font-size="18" font-weight="600" fill="#166534" text-anchor="middle">In-memory model</text>
  <rect x="500" y="264" width="250" height="44" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="625" y="291" font-size="15" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">TestResults</text>
  <rect x="500" y="322" width="250" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="625" y="346" font-size="15" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">TestResult</text>
  <text x="625" y="368" font-size="12" fill="#166534" text-anchor="middle">Name, ClassName, Duration, Error…</text>
  <rect x="500" y="396" width="250" height="52" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="625" y="418" font-size="15" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">TestOutcome</text>
  <text x="625" y="437" font-size="12" fill="#166534" text-anchor="middle">IsPassed() IsFailed() IsExecuted()</text>

  <rect x="215" y="216" width="190" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="243" font-size="15" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">TrxSerializer</text>
  <text x="310" y="264" font-size="12" fill="#1e40af" text-anchor="middle">Serialize / Deserialize</text>

  <rect x="215" y="309" width="190" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="336" font-size="15" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">JUnitSerializer</text>
  <text x="310" y="357" font-size="12" fill="#1e40af" text-anchor="middle">Serialize / Deserialize</text>

  <rect x="215" y="402" width="190" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="429" font-size="15" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">Serializer</text>
  <text x="310" y="450" font-size="12" fill="#1e40af" text-anchor="middle">Deserialize (auto-detect)</text>

  <line x1="409" y1="248" x2="476" y2="248" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="409" y1="341" x2="476" y2="341" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="409" y1="434" x2="476" y2="434" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="20" y="216" width="140" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="243" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">TRX file</text>
  <text x="90" y="264" font-size="12" fill="#475569" text-anchor="middle">.trx</text>

  <rect x="20" y="309" width="140" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="336" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">JUnit file</text>
  <text x="90" y="357" font-size="12" fill="#475569" text-anchor="middle">.xml</text>

  <rect x="20" y="402" width="140" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="429" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Either format</text>
  <text x="90" y="450" font-size="12" fill="#475569" text-anchor="middle">.trx or .xml</text>

  <line x1="164" y1="248" x2="211" y2="248" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="164" y1="341" x2="211" y2="341" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="164" y1="434" x2="211" y2="434" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <text x="90" y="170" font-size="12" fill="#475569" text-anchor="middle">Files used by Visual Studio,</text>
  <text x="90" y="186" font-size="12" fill="#475569" text-anchor="middle">Azure DevOps and CI/CD</text>
  <line x1="90" y1="196" x2="90" y2="212" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>
  </svg>
